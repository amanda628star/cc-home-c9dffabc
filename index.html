<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邓瑜的生财AI主页</title>
<style>
:root{
  --green:#1c6b46; --green-light:#e8f3ec; --cream:#faf7f1; --ink:#2b2b2b;
  --sub:#8a857c; --line:#ece7dc; --gold:#b08a3e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;padding-bottom:40px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,#1c6b46,#2d8a5e);color:#fff;padding:28px 20px 22px;border-radius:0 0 22px 22px;margin-bottom:18px}
header .hi{font-size:13px;opacity:.85;letter-spacing:1px}
header h1{font-size:21px;margin:4px 0 10px;font-weight:600}
.chip{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:12px;margin:0 6px 6px 0}
.sync{font-size:12px;opacity:.8;margin-top:8px}
.section-title{font-size:16px;font-weight:600;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:16px;background:var(--green);border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat .num{font-size:22px;font-weight:700;color:var(--green)}
.stat .label{font-size:11px;color:var(--sub);margin-top:2px}
.tabs{display:flex;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub);cursor:pointer}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card h3{font-size:15px;font-weight:600;line-height:1.45}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:active{color:var(--green)}
.meta{font-size:12px;color:var(--sub);margin:6px 0 8px}
.tag{display:inline-block;background:var(--green-light);color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;margin-right:6px}
.reason{font-size:13px;color:#555;background:var(--cream);border-radius:10px;padding:8px 10px;margin:8px 0}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;font-size:12px;color:#666;cursor:pointer}
.btn.done{background:var(--green-light);color:var(--green);border-color:var(--green-light)}
.btn.fav{background:#fdf3e3;color:var(--gold);border-color:#f5e4c4}
.btn.meh{color:#aaa}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 0}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:30px;line-height:1.8}
.pull{display:block;width:100%;background:#fff;border:1px dashed var(--green);color:var(--green);border-radius:12px;padding:11px;font-size:13px;margin-top:14px;cursor:pointer}
.badge-read{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <div class="hi">邓瑜的生财 AI 主页 · <a href="archive.html" style="color:#fff;opacity:.9">我的档案库 →</a></div>
    <h1>早，今天也往前走一步</h1>
    <div>
      <span class="chip">真人成长博主</span>
      <span class="chip">小红书 · 虚拟产品</span>
      <span class="chip">生财分销</span>
      <span class="chip">AI Agent 实践者</span>
    </div>
    <div class="sync" id="syncTime"></div>
  </div>
</header>

<div class="wrap">

  <div class="section-title">我的生财年度复盘</div>
  <div class="stats">
    <div class="stat"><div class="num">9</div><div class="label">参加航海</div></div>
    <div class="stat"><div class="num">80+</div><div class="label">作业/打卡</div></div>
    <div class="stat"><div class="num">9</div><div class="label">作业评好事</div></div>
    <div class="stat"><div class="num">7</div><div class="label">分销成交(单)</div></div>
  </div>

  <div class="section-title">今日精选（5篇）</div>
  <div class="tabs">
    <div class="tab active" data-tab="today">精选未读</div>
    <div class="tab" data-tab="all">全部</div>
    <div class="tab" data-tab="read">已读</div>
    <div class="tab" data-tab="fav">收藏</div>
    <div class="tab" data-tab="meh">不感兴趣</div>
  </div>
  <div id="list"></div>
  <button class="pull" id="pullBtn">今日额外抓取 5 篇（需 AI 运行）</button>

  <div class="section-title">当前定位</div>
  <div class="card" style="font-size:13px;color:#555">
    住家家政为收入底盘，小红书真人号 + 生财分销为积累线。
    现阶段关键动作：把一个方向不间断地跑到复利拐点，不再重启。
    阶段变化或目标调整时，告诉 AI 更新本页画像。
  </div>

  <footer>
    本页由 AI 按纪钟《如何构建更懂自己的 AI 和生财主页？》方法生成<br>
    生财有术内容仅供本人学习，严禁外传 · 你我，就是黑马
  </footer>
</div>

<script src="data.js"></script>
<script>
const FALLBACK_PICKS = [
  {id:"5122181884285214", title:"小红书越做越没流量？像素级带你高效模仿爆款笔记", author:"梨云", digested:true,
   tags:["小红书","起号"],
   reason:"你反复研究这篇（读过3次）。新人起号最快的路径不是原创，是像素级拆解爆款再复刻。"},
  {id:"82258251252858142", title:"小红书虚拟产品 X 公众号垂直小号，20天累计变现收入上5位数", author:"心海的猫", digested:true,
   tags:["虚拟产品","公众号","变现"],
   reason:"你读过全文且点赞。作者在浙江宁波，跑通的正是你关注的小红书+公众号组合打法。"},
  {id:"45548814885851888", title:"32岁宝妈失业后，靠生财有术做公众号半年变现6位数", author:"糖壹", digested:false,
   tags:["失业重启","公众号","女性成长"],
   reason:"你读过、点赞过。失业不是终点是重新选择的起点——和你当下处境直接相关。"},
  {id:"82255444845254442", title:"从淘宝找产品，到小红书找人群：我的月入5万虚拟资料选品方法", author:"冬青", digested:true,
   tags:["小红书","选品","虚拟资料"],
   reason:"你读过这篇。选品的核心是先找人群和真实需求，再回头找产品，可直接用于你的号。"},
  {id:"55188451551845544", title:"【AI+小绿书】2个月签单5.9w，获客1112人：高客单流量的通用SOP", author:"些些怡", digested:true,
   tags:["小红书","AI获客","SOP"],
   reason:"你读过、点赞过。把获客做成可复制SOP，正是你真人号下一步要补的环节。"}
];
const PICKS = (window.PICKS_DATA && window.PICKS_DATA.picks) || FALLBACK_PICKS;
const url = id => "https://scys.com/articleDetail/xq_topic/"+id;

let state = JSON.parse(localStorage.getItem("cc-home-state") || "{}");
function save(){ localStorage.setItem("cc-home-state", JSON.stringify(state)); }
function setStatus(id, s){
  if(state[id]===s) delete state[id]; else state[id]=s;
  save(); render();
}

let curTab = "today";
function render(){
  const list = document.getElementById("list");
  let items = PICKS.slice();
  const f = {
    today: p => state[p.id] !== "read" && state[p.id] !== "meh",
    all: () => true,
    read: p => state[p.id] === "read",
    fav: p => state[p.id] === "fav",
    meh: p => state[p.id] === "meh"
  }[curTab];
  items = items.filter(f);
  if(!items.length){ list.innerHTML = '<div class="empty">这里还空着</div>'; return; }
  list.innerHTML = items.map(p => {
    const s = state[p.id];
    return `<div class="card">
      <h3><a href="${url(p.id)}">${p.title}</a>${s==="read"?'<span class="badge-read">已读</span>':''}</h3>
      <div class="meta">${p.author}${p.digested?' · 精华':''}</div>
      <div>${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="reason">为什么推给你：${p.reason}</div>
      <div class="btns">
        <button class="btn ${s==="read"?"done":""}" onclick="setStatus('${p.id}','read')">${s==="read"?"✓ 已读":"标已读"}</button>
        <button class="btn ${s==="fav"?"fav":""}" onclick="setStatus('${p.id}','fav')">${s==="fav"?"★ 已收藏":"收藏"}</button>
        <button class="btn ${s==="meh"?"meh":""}" onclick="setStatus('${p.id}','meh')">不感兴趣</button>
      </div>
    </div>`;
  }).join("");
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); curTab = t.dataset.tab; render();
});
document.getElementById("pullBtn").onclick = () => alert("把这句话发给AI：今日额外抓取5篇与我当前阶段相关的生财精华帖，追加到主页。");

const pad = n => String(n).padStart(2,"0");
const syncInfo = window.PICKS_DATA && window.PICKS_DATA.lastSync;
const syncDate = syncInfo ? new Date(syncInfo + "T08:30:00+08:00") : new Date();
document.getElementById("syncTime").textContent =
  "最近同步：" + syncDate.getFullYear()+"-"+pad(syncDate.getMonth()+1)+"-"+pad(syncDate.getDate()) +
  " · " + ((window.PICKS_DATA && window.PICKS_DATA.note) || "本次候选50篇，精选5篇");

render();
</script>
</body>
</html>
